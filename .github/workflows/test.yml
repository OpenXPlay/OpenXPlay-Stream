name: Test

# Pull requests run the checks that main requires; push runs only for main itself.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy && rustup default 1.99.1
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Test
        run: cargo test --workspace --locked --offline
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Separate code: the Android relay ships the first, the Linux relay the second.
        receiver: [kotlin/web-receiver, rust/web-receiver]
    defaults:
      run:
        working-directory: ${{ matrix.receiver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.receiver }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  kotlin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
