[package]
name = "oxp-bin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
oxp-core = { path = "../oxp-core" }
oxp-web = { path = "../oxp-web" }
oxp-wire = { path = "../oxp-wire" }
oxp-clink = { path = "../oxp-clink" }
oxp-link-linux = { path = "../oxp-link-linux" }
oxp-media = { path = "../oxp-media" }
oxp-transcode-linux = { path = "../oxp-transcode-linux" }
serde_json = "1.0.151"
base64 = "0.22.1"

[[bin]]
name = "oxp-clink"
path = "src/bin/oxp-clink.rs"

[[bin]]
name = "oxp-replay"
path = "src/bin/oxp-replay.rs"

[[bin]]
name = "oxp-relay"
path = "src/bin/oxp-relay.rs"
