[package]
name = "oxp-clink"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oxp-core = { path = "../oxp-core" }
oxp-media = { path = "../oxp-media" }
aes-gcm = "0.10.3"
p256 = { version = "0.13.2", features = ["ecdh", "ecdsa", "pkcs8"] }
